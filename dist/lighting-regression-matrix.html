<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gallery Viewer Lighting Regression Matrix</title>
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; background: #111; color: #eee; font: 13px/1.35 sans-serif; }
        body { display: grid; grid-template-rows: auto 1fr; }
        header { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #202020; }
        header span { color: #aaa; }
        select { max-width: 430px; }
        main { min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; }
        section { position: relative; min-width: 0; min-height: 0; background: #000; }
        iframe { width: 100%; height: 100%; border: 0; }
        .label { position: absolute; z-index: 2; top: 8px; right: 8px; padding: 5px 7px; background: rgba(0, 0, 0, 0.72); pointer-events: none; }
        .code { color: #8ac7ff; }
        .three { color: #f4c777; }
    </style>
</head>
<body>
    <header>
        <label for="fixture">Fixture</label>
        <select id="fixture">
            <option>Loading full fixture catalog…</option>
        </select>
        <span>Rows change viewer code. Columns change only Three.js.</span>
    </header>
    <main>
        <section>
            <div class="label"><span class="code">Production code</span> / <span class="three">Three 0.172</span> — deployed baseline</div>
            <iframe data-bundle="production" data-three="0.172.0" title="Production code with Three 0.172"></iframe>
        </section>
        <section>
            <div class="label"><span class="code">Production code</span> / <span class="three">Three 0.185.1</span></div>
            <iframe data-bundle="production" data-three="0.185.1" title="Production code with Three 0.185.1"></iframe>
        </section>
        <section>
            <div class="label"><span class="code">Main code</span> / <span class="three">Three 0.172</span></div>
            <iframe data-bundle="main" data-three="0.172.0" title="Main code with Three 0.172"></iframe>
        </section>
        <section>
            <div class="label"><span class="code">Main code</span> / <span class="three">Three 0.185.1</span> — current</div>
            <iframe data-bundle="main" data-three="0.185.1" title="Main code with Three 0.185.1"></iframe>
        </section>
    </main>
    <script type="module">
        import { populateFixtureSelect } from "./comparison-fixtures.js";

        const fixtureSelect = document.getElementById("fixture");
        const initialFixture = new URLSearchParams(location.search).get("fixture") || "api-01lqee-dZAr";

        function loadFixture() {
            const fixture = fixtureSelect.value;
            const url = new URL(location.href);
            url.searchParams.set("fixture", fixture);
            history.replaceState(null, "", url);
            document.querySelectorAll("iframe").forEach(frame => {
                const params = new URLSearchParams({
                    bundle: frame.dataset.bundle,
                    three: frame.dataset.three,
                    fixture
                });
                frame.src = `./comparison.html?${params}`;
            });
        }

        fixtureSelect.addEventListener("change", loadFixture);

        async function populateFixtureCatalog() {
            await populateFixtureSelect(fixtureSelect, initialFixture);
            loadFixture();
        }

        populateFixtureCatalog().catch(error => {
            fixtureSelect.replaceChildren(new Option(`Fixture catalog error: ${error.message}`));
        });
    </script>
</body>
</html>
