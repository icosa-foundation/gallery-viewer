<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Icosa Viewer: Production vs Main vs Poly</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            color: #fff;
            background: #111;
            font: 13px/1.3 system-ui, sans-serif;
        }

        #toolbar {
            height: 44px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: #202124;
        }

        #viewers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: calc(100% - 44px);
        }

        #viewers.with-reference {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .viewer-column {
            position: relative;
            min-width: 0;
            border-right: 1px solid #555;
        }

        .viewer-column:last-child {
            border-right: 0;
        }

        .viewer-label {
            position: absolute;
            top: 10px;
            left: 50%;
            z-index: 2;
            transform: translateX(-50%);
            padding: 5px 9px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.75);
            pointer-events: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        #reference {
            display: none;
            position: relative;
            box-sizing: border-box;
            padding: 0;
            overflow: hidden;
            background: #202124;
        }

        #viewers.with-reference #reference {
            display: block;
        }

        #poly-reference-viewer,
        #reference-thumbnail {
            width: 100%;
            height: 100%;
            border: 0;
        }

        #reference-thumbnail {
            object-fit: contain;
            background: #000;
        }

        #reference[data-reference-mode="poly"] #reference-thumbnail,
        #reference[data-reference-mode="thumbnail"] #poly-reference-viewer {
            display: none;
        }

        #reference-details {
            position: absolute;
            right: 10px;
            bottom: 10px;
            left: 10px;
            z-index: 2;
            box-sizing: border-box;
            padding: 7px 9px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.75);
        }

        #reference-name {
            margin: 0 0 4px;
            font-weight: 600;
        }

        #reference a {
            color: #8ab4f8;
        }

        #lighting-summary {
            overflow: hidden;
            color: #bdc1c6;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #poly-controls {
            display: none;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        body.fallback-tuning-available.middle-lighting #poly-controls {
            display: flex;
        }

        #poly-controls input[type="range"] {
            width: 80px;
        }

        #poly-controls output {
            width: 3ch;
            color: #bdc1c6;
            font-variant-numeric: tabular-nums;
        }

        #bloom-controls {
            display: none;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        body.middle-bloom #bloom-controls {
            display: flex;
        }

        #vignette-controls {
            display: none;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        body.middle-vignette #vignette-controls {
            display: flex;
        }

        #vignette-controls input[type="range"] {
            width: 90px;
        }

        #vignette-controls output {
            width: 3.5ch;
            color: #bdc1c6;
            font-variant-numeric: tabular-nums;
        }

        #bloom-controls input[type="range"] {
            width: 68px;
        }

        #bloom-controls output {
            width: 3.5ch;
            color: #bdc1c6;
            font-variant-numeric: tabular-nums;
        }

        #left-mode,
        #middle-mode,
        #reference-mode,
        #bloom-auto,
        #vignette-auto,
        #lighting-toggle,
        #lighting-close {
            border: 1px solid #5f6368;
            border-radius: 4px;
            padding: 4px 8px;
            color: #fff;
            background: #303134;
            cursor: pointer;
        }

        #lighting-panel {
            position: fixed;
            top: 52px;
            right: 12px;
            z-index: 10;
            width: min(480px, calc(100vw - 24px));
            max-height: calc(100vh - 64px);
            box-sizing: border-box;
            overflow: auto;
            border: 1px solid #5f6368;
            border-radius: 6px;
            padding: 12px;
            color: #e8eaed;
            background: rgba(32, 33, 36, 0.97);
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.45);
        }

        #lighting-panel[hidden] {
            display: none;
        }

        #lighting-panel header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        #lighting-panel h2,
        #lighting-panel h3 {
            margin: 0;
        }

        #lighting-panel h2 {
            font-size: 16px;
        }

        #lighting-panel h3 {
            margin-top: 12px;
            font-size: 13px;
            color: #8ab4f8;
        }

        #lighting-panel p {
            margin: 4px 0;
        }

        #lighting-panel ul {
            margin: 4px 0 0;
            padding-left: 20px;
        }

        #lighting-panel .muted {
            color: #bdc1c6;
        }

        #lighting-panel a {
            color: #8ab4f8;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <label for="fixture">Fixture</label>
        <select id="fixture">
            <option>Loading full fixture catalog…</option>
        </select>
        <button id="left-mode" type="button" value="production">Left: Production</button>
        <button id="middle-mode" type="button" value="main">Middle: Main</button>
        <span id="bloom-controls">
            <label for="bloom-strength">Str</label>
            <input id="bloom-strength" type="range" min="0" max="1" step="0.01" value="0.05">
            <output id="bloom-strength-value" for="bloom-strength">0.05</output>
            <label for="bloom-threshold">Cut</label>
            <input id="bloom-threshold" type="range" min="0" max="3" step="0.05" value="0">
            <output id="bloom-threshold-value" for="bloom-threshold">0.00</output>
            <label for="bloom-radius">Rad</label>
            <input id="bloom-radius" type="range" min="0" max="1" step="0.05" value="0">
            <output id="bloom-radius-value" for="bloom-radius">0.00</output>
            <button id="bloom-auto" type="button">Auto</button>
        </span>
        <span id="vignette-controls">
            <label for="vignette-strength">Vig</label>
            <input id="vignette-strength" type="range" min="0" max="2" step="0.05" value="0.5">
            <output id="vignette-strength-value" for="vignette-strength">0.50</output>
            <button id="vignette-auto" type="button">Auto</button>
        </span>
        <span id="poly-controls">
            <label for="poly-scale">Scale</label>
            <input id="poly-scale" type="range" min="0" max="1.5" step="0.05" value="0.35">
            <output id="poly-scale-value" for="poly-scale">0.35</output>
            <label for="poly-hemi">Hemi</label>
            <input id="poly-hemi" type="range" min="0" max="2" step="0.05" value="0.5">
            <output id="poly-hemi-value" for="poly-hemi">0.50</output>
            <label for="poly-head">Head</label>
            <input id="poly-head" type="range" min="0" max="2" step="0.05" value="1">
            <output id="poly-head-value" for="poly-head">1.00</output>
        </span>
        <button id="reference-mode" type="button" value="poly">Right: Poly</button>
        <button id="lighting-toggle" type="button">Lighting evidence</button>
        <span id="lighting-summary">Lighting evidence loading…</span>
    </div>
    <aside id="lighting-panel" aria-live="polite" hidden>
        <header>
            <h2>Lighting-source evidence</h2>
            <button id="lighting-close" type="button">Close</button>
        </header>
        <div id="lighting-report">Loading selected rendition…</div>
    </aside>
    <div id="viewers">
        <section class="viewer-column">
            <div id="left-label" class="viewer-label">Production Gallery bundle</div>
            <iframe id="left-viewer" title="Left comparison viewer"></iframe>
        </section>
        <section class="viewer-column">
            <div id="middle-label" class="viewer-label">Current main bundle</div>
            <iframe id="middle-viewer" title="Middle comparison viewer"></iframe>
        </section>
        <aside id="reference" class="viewer-column" data-reference-mode="poly">
            <div id="reference-label" class="viewer-label">Resurrected Google Poly</div>
            <iframe id="poly-reference-viewer" title="Resurrected Google Poly viewer"></iframe>
            <img id="reference-thumbnail" alt="Authoritative source thumbnail">
            <div id="reference-details">
                <div id="reference-name"></div>
                <a id="reference-metadata" target="_blank" rel="noreferrer">API metadata</a>
            </div>
        </aside>
    </div>
    <script type="module">
        import {
            assetIdForFixture,
            inspectFixtureLighting,
            polyModelForFixture,
            populateFixtureSelect
        } from "./comparison-fixtures.js?v=electricity-1";

        const fixtureSelect = document.getElementById("fixture");
        const leftModeButton = document.getElementById("left-mode");
        const middleModeButton = document.getElementById("middle-mode");
        const referenceModeButton = document.getElementById("reference-mode");
        const leftViewer = document.getElementById("left-viewer");
        const middleViewer = document.getElementById("middle-viewer");
        const leftLabel = document.getElementById("left-label");
        const middleLabel = document.getElementById("middle-label");
        const polyReferenceViewer = document.getElementById("poly-reference-viewer");
        const viewers = document.getElementById("viewers");
        const reference = document.getElementById("reference");
        const referenceLabel = document.getElementById("reference-label");
        const referenceThumbnail = document.getElementById("reference-thumbnail");
        const referenceName = document.getElementById("reference-name");
        const referenceMetadata = document.getElementById("reference-metadata");
        const lightingToggle = document.getElementById("lighting-toggle");
        const lightingClose = document.getElementById("lighting-close");
        const lightingPanel = document.getElementById("lighting-panel");
        const lightingReport = document.getElementById("lighting-report");
        const lightingSummary = document.getElementById("lighting-summary");
        const polyScale = document.getElementById("poly-scale");
        const polyHemisphere = document.getElementById("poly-hemi");
        const polyHead = document.getElementById("poly-head");
        const polyScaleValue = document.getElementById("poly-scale-value");
        const polyHemisphereValue = document.getElementById("poly-hemi-value");
        const polyHeadValue = document.getElementById("poly-head-value");
        const bloomStrength = document.getElementById("bloom-strength");
        const bloomThreshold = document.getElementById("bloom-threshold");
        const bloomRadius = document.getElementById("bloom-radius");
        const bloomStrengthValue = document.getElementById("bloom-strength-value");
        const bloomThresholdValue = document.getElementById("bloom-threshold-value");
        const bloomRadiusValue = document.getElementById("bloom-radius-value");
        const bloomAuto = document.getElementById("bloom-auto");
        const vignetteStrength = document.getElementById("vignette-strength");
        const vignetteStrengthValue = document.getElementById("vignette-strength-value");
        const vignetteAuto = document.getElementById("vignette-auto");
        const pageParams = new URLSearchParams(location.search);
        const initialFixture = new URLSearchParams(location.search).get("fixture") || "f4-0";
        const requestedComparisonMode = pageParams.get("mode");
        const requestedReferenceMode = new URLSearchParams(location.search).get("reference");
        const initialLeftMode = pageParams.get("left") === "main" || requestedComparisonMode === "hypothesis"
            ? "main"
            : "production";
        const requestedMiddleMode = pageParams.get("middle");
        const initialMiddleMode = requestedMiddleMode === "lighting" || requestedComparisonMode === "hypothesis"
            ? "lighting"
            : requestedMiddleMode === "bloom" || requestedMiddleMode === "vignette"
                ? requestedMiddleMode
                : "main";
        const initialReferenceMode = requestedReferenceMode === "thumbnail" ? "thumbnail" : "poly";
        const polyReplayOrigin = `${location.protocol}//${location.hostname}:8766`;
        let lightingRequest = 0;
        polyScale.value = pageParams.get("polyScale") || "0.35";
        polyHemisphere.value = pageParams.get("polyHemi") || "0.5";
        polyHead.value = pageParams.get("polyHead") || "1";
        let bloomValuesExplicit = ["bloomStrength", "bloomThreshold", "bloomRadius"]
            .some(name => pageParams.has(name));
        bloomStrength.value = pageParams.get("bloomStrength") || "0.05";
        bloomThreshold.value = pageParams.get("bloomThreshold") || "0";
        bloomRadius.value = pageParams.get("bloomRadius") || "0";
        let vignetteValueExplicit = pageParams.has("vignetteStrength");
        vignetteStrength.value = pageParams.get("vignetteStrength") || "0.5";
        leftModeButton.value = initialLeftMode;
        middleModeButton.value = initialMiddleMode;
        referenceModeButton.value = initialReferenceMode;

        function updatePaneButtons() {
            leftModeButton.textContent = leftModeButton.value === "main" ? "Left: Main" : "Left: Production";
            middleModeButton.textContent = middleModeButton.value === "lighting"
                ? "Middle: Lighting"
                : middleModeButton.value === "vignette"
                    ? "Middle: Vignette"
                    : middleModeButton.value === "bloom" ? "Middle: Bloom" : "Middle: Main";
        }

        leftModeButton.addEventListener("click", () => {
            leftModeButton.value = leftModeButton.value === "production" ? "main" : "production";
            loadFixture();
        });

        middleModeButton.addEventListener("click", () => {
            middleModeButton.value = middleModeButton.value === "main"
                ? "lighting"
                : middleModeButton.value === "lighting"
                    ? "vignette"
                    : middleModeButton.value === "vignette" ? "bloom" : "main";
            loadFixture();
        });
        updatePaneButtons();

        function updateReferenceModeButton() {
            const thumbnailMode = referenceModeButton.value === "thumbnail";
            referenceModeButton.textContent = thumbnailMode ? "Right: Thumbnail" : "Right: Poly";
            referenceModeButton.title = thumbnailMode
                ? "Switch ground truth to resurrected Google Poly"
                : "Switch ground truth to the preserved thumbnail";
        }

        referenceModeButton.addEventListener("click", () => {
            referenceModeButton.value = referenceModeButton.value === "poly" ? "thumbnail" : "poly";
            updateReferenceModeButton();
            loadFixture();
        });
        updateReferenceModeButton();

        function updatePolyControls() {
            const values = {
                type: "poly-fallback-controls",
                scale: Number(polyScale.value),
                hemisphereMultiplier: Number(polyHemisphere.value),
                headMultiplier: Number(polyHead.value)
            };
            polyScaleValue.value = values.scale.toFixed(2);
            polyHemisphereValue.value = values.hemisphereMultiplier.toFixed(2);
            polyHeadValue.value = values.headMultiplier.toFixed(2);
            const url = new URL(location.href);
            url.searchParams.set("polyScale", String(values.scale));
            url.searchParams.set("polyHemi", String(values.hemisphereMultiplier));
            url.searchParams.set("polyHead", String(values.headMultiplier));
            history.replaceState(null, "", url);
            middleViewer.contentWindow?.postMessage(values, location.origin);
        }

        [polyScale, polyHemisphere, polyHead].forEach(control => {
            control.addEventListener("input", updatePolyControls);
        });
        updatePolyControls();

        function updateBloomValueLabels() {
            bloomStrengthValue.value = Number(bloomStrength.value).toFixed(2);
            bloomThresholdValue.value = Number(bloomThreshold.value).toFixed(2);
            bloomRadiusValue.value = Number(bloomRadius.value).toFixed(2);
        }

        function updateBloomControls() {
            bloomValuesExplicit = true;
            updateBloomValueLabels();
            const values = {
                type: "viewer-post-processing-controls",
                strength: Number(bloomStrength.value),
                threshold: Number(bloomThreshold.value),
                radius: Number(bloomRadius.value)
            };
            const url = new URL(location.href);
            url.searchParams.set("bloomStrength", String(values.strength));
            url.searchParams.set("bloomThreshold", String(values.threshold));
            url.searchParams.set("bloomRadius", String(values.radius));
            history.replaceState(null, "", url);
            middleViewer.contentWindow?.postMessage(values, location.origin);
        }

        [bloomStrength, bloomThreshold, bloomRadius].forEach(control => {
            control.addEventListener("input", updateBloomControls);
        });
        bloomAuto.addEventListener("click", () => {
            bloomValuesExplicit = false;
            const url = new URL(location.href);
            url.searchParams.delete("bloomStrength");
            url.searchParams.delete("bloomThreshold");
            url.searchParams.delete("bloomRadius");
            history.replaceState(null, "", url);
            loadFixture();
        });
        updateBloomValueLabels();

        function updateVignetteValueLabel() {
            vignetteStrengthValue.value = Number(vignetteStrength.value).toFixed(2);
        }

        vignetteStrength.addEventListener("input", () => {
            vignetteValueExplicit = true;
            updateVignetteValueLabel();
            const strength = Number(vignetteStrength.value);
            const url = new URL(location.href);
            url.searchParams.set("vignetteStrength", String(strength));
            history.replaceState(null, "", url);
            middleViewer.contentWindow?.postMessage({
                type: "viewer-post-processing-controls",
                effect: "vignette",
                strength
            }, location.origin);
        });
        vignetteAuto.addEventListener("click", () => {
            vignetteValueExplicit = false;
            const url = new URL(location.href);
            url.searchParams.delete("vignetteStrength");
            history.replaceState(null, "", url);
            loadFixture();
        });
        updateVignetteValueLabel();

        window.addEventListener("message", event => {
            if (event.origin !== location.origin || event.source !== middleViewer.contentWindow) return;
            if (event.data?.type === "viewer-fallback-lighting-status") {
                document.body.classList.toggle(
                    "fallback-tuning-available",
                    event.data.usesFallbackLighting === true
                );
            }
            if (
                event.data?.type === "viewer-post-processing-status"
                && middleModeButton.value === "bloom"
                && !bloomValuesExplicit
                && event.data.postProcessing?.bloom?.enabled
            ) {
                bloomStrength.value = String(event.data.postProcessing.bloom.strength);
                bloomThreshold.value = String(event.data.postProcessing.bloom.threshold);
                bloomRadius.value = String(event.data.postProcessing.bloom.radius);
                updateBloomValueLabels();
            }
            if (
                event.data?.type === "viewer-post-processing-status"
                && middleModeButton.value === "vignette"
                && !vignetteValueExplicit
                && event.data.postProcessing?.vignette?.enabled
            ) {
                vignetteStrength.value = String(event.data.postProcessing.vignette.strength);
                updateVignetteValueLabel();
            }
        });

        lightingToggle.addEventListener("click", () => {
            lightingPanel.hidden = !lightingPanel.hidden;
        });
        lightingClose.addEventListener("click", () => {
            lightingPanel.hidden = true;
        });

        function appendEvidenceSection(title, lines) {
            const heading = document.createElement("h3");
            heading.textContent = title;
            lightingReport.appendChild(heading);
            const list = document.createElement("ul");
            for (const line of lines) {
                const item = document.createElement("li");
                item.textContent = line;
                list.appendChild(item);
            }
            lightingReport.appendChild(list);
        }

        function renderLightingEvidence(report) {
            lightingReport.replaceChildren();
            const rendition = document.createElement("p");
            rendition.textContent = `${report.label} · selected ${report.rendition.formatType}`;
            lightingReport.appendChild(rendition);

            const link = document.createElement("a");
            link.href = report.rendition.url;
            link.target = "_blank";
            link.rel = "noreferrer";
            link.textContent = "Open inspected model root";
            lightingReport.appendChild(link);

            if (report.model) {
                const model = report.model;
                appendEvidenceSection("Material path", [
                    `Generator: ${model.generator}`,
                    `${model.materials.count} materials: ${model.materials.pbr} PBR, ${model.materials.emissive} emissive, ${model.materials.unlit} unlit`,
                    model.materials.techniques.length
                        ? `Technique systems: ${model.materials.techniques.join(", ")}`
                        : "No technique-based material system declared"
                ]);
                appendEvidenceSection("Embedded scene lights", [
                    `KHR_lights_punctual: ${model.embeddedLights.punctualDefinitions} definitions on ${model.embeddedLights.punctualNodes} nodes`,
                    model.embeddedLights.punctualTypes.length
                        ? `Types: ${model.embeddedLights.punctualTypes.join(", ")}`
                        : "No punctual light types declared",
                    ...model.embeddedLights.punctualDetails.map(light =>
                        `${light.name}: ${light.type}, intensity ${light.intensity}, color [${light.color.join(", ")}]`
                    ),
                    `Legacy KHR_materials_common lights: ${model.embeddedLights.legacyCommon}`
                ]);
                appendEvidenceSection("Exporter metadata", [
                    model.exporterMetadata.keys.length
                        ? `Fields: ${model.exporterMetadata.keys.join(", ")}`
                        : "No TB_* or GOOGLE_* fields found in inspected extras",
                    model.exporterMetadata.dummyLightNodes.length
                        ? `Dummy light transforms: ${model.exporterMetadata.dummyLightNodes.join(", ")}`
                        : "No node_SceneLight_* transforms found"
                ]);
            } else {
                appendEvidenceSection("Model document", [report.inspectionError || "Model document was not inspected"]);
            }

            appendEvidenceSection("Presentation lighting", report.presentation.length
                ? report.presentation.map(field => `${field.key}: ${field.populated ? "populated" : "present but empty/null"}`)
                : ["No recognised presentation lighting fields"]);

            const currentViewerLines = [
                "SketchMetadata creates two directional lights plus one ambient light from metadata, preset values, or white defaults.",
                "Recognised presentation hemisphere and lighting-rig fields are not currently interpreted."
            ];
            if (report.model?.embeddedLights.punctualDefinitions) {
                currentViewerLines.unshift(
                    `${report.model.embeddedLights.punctualDefinitions} embedded punctual lights can remain alongside the generated Gallery rig.`
                );
            }
            if (report.model?.exporterMetadata.dummyLightNodes.length) {
                currentViewerLines.unshift(
                    "node_SceneLight_* transforms are consumed and removed before Gallery creates replacement directional lights."
                );
            }
            appendEvidenceSection("Current Gallery Viewer path", currentViewerLines);

            const warning = document.createElement("p");
            warning.className = "muted";
            warning.textContent = "This reports evidence only. Presence does not yet establish whether a source replaces or augments another source.";
            lightingReport.appendChild(warning);

            const embeddedCount = report.model
                ? report.model.embeddedLights.punctualDefinitions + report.model.embeddedLights.legacyCommon
                : "?";
            const exporterCount = report.model ? report.model.exporterMetadata.keys.length : "?";
            lightingSummary.textContent = `Lights: ${embeddedCount} embedded · ${exporterCount} exporter fields · ${report.presentation.length} presentation fields`;
        }

        async function updateLightingEvidence(fixture) {
            const request = ++lightingRequest;
            lightingSummary.textContent = "Lighting evidence loading…";
            lightingReport.textContent = "Inspecting selected rendition and presentation data…";
            try {
                const report = await inspectFixtureLighting(fixture);
                if (request !== lightingRequest) return;
                renderLightingEvidence(report);
            } catch (error) {
                if (request !== lightingRequest) return;
                lightingSummary.textContent = "Lighting inspection failed";
                lightingReport.textContent = `Lighting inspection error: ${error.message}`;
            }
        }

        async function updateReference(fixture) {
            const apiAssetId = assetIdForFixture(fixture);
            const localModelPath = polyModelForFixture(fixture);
            if (!apiAssetId && !localModelPath) {
                viewers.classList.remove("with-reference");
                polyReferenceViewer.removeAttribute("src");
                referenceThumbnail.removeAttribute("src");
                return;
            }

            viewers.classList.add("with-reference");
            reference.dataset.referenceMode = referenceModeButton.value;
            referenceLabel.textContent = referenceModeButton.value === "poly"
                ? "Resurrected Google Poly"
                : "Preserved thumbnail (fallback)";
            if (apiAssetId) {
                polyReferenceViewer.src = `${polyReplayOrigin}/view/${encodeURIComponent(apiAssetId)}/embed?asset=${encodeURIComponent(apiAssetId)}&controls=0`;
            } else {
                polyReferenceViewer.src = `${polyReplayOrigin}/view/fbDxapxkwY9/embed?model=${encodeURIComponent(localModelPath)}&controls=0`;
            }

            if (!apiAssetId) {
                const selectedOption = fixtureSelect.options[fixtureSelect.selectedIndex];
                referenceName.textContent = `${selectedOption.textContent} — local fixture in Poly renderer`;
                referenceMetadata.hidden = true;
                referenceThumbnail.removeAttribute("src");
                return;
            }

            referenceMetadata.hidden = false;
            referenceName.textContent = "Loading metadata";
            referenceMetadata.href = `https://api.icosa.gallery/v1/assets/${apiAssetId}`;
            const response = await fetch(referenceMetadata.href);
            const asset = await response.json();
            referenceName.textContent = `${asset.displayName} — ${asset.authorName || "Unknown author"}`;
            referenceThumbnail.src = asset.thumbnail?.url || "";
        }

        function loadFixture() {
            const fixture = fixtureSelect.value;
            updatePaneButtons();
            document.body.classList.remove("fallback-tuning-available");
            document.body.classList.toggle("middle-lighting", middleModeButton.value === "lighting");
            document.body.classList.toggle("middle-bloom", middleModeButton.value === "bloom");
            document.body.classList.toggle("middle-vignette", middleModeButton.value === "vignette");
            const url = new URL(location.href);
            url.searchParams.set("fixture", fixture);
            url.searchParams.delete("lighting");
            url.searchParams.delete("mode");
            url.searchParams.set("left", leftModeButton.value);
            url.searchParams.set("middle", middleModeButton.value);
            url.searchParams.set("reference", referenceModeButton.value);
            history.replaceState(null, "", url);
            const leftBundle = leftModeButton.value === "main" ? "main" : "production";
            leftLabel.textContent = leftBundle === "main" ? "Current main bundle" : "Production Gallery bundle";
            leftViewer.src = `./comparison.html?bundle=${leftBundle}&fixture=${encodeURIComponent(fixture)}&v=electricity-1`;

            const middleUrl = new URL("./comparison.html", location.href);
            middleUrl.searchParams.set("bundle", "main");
            middleUrl.searchParams.set("fixture", fixture);
            middleUrl.searchParams.set("v", "electricity-1");
            if (middleModeButton.value === "lighting") {
                middleLabel.textContent = "Poly-style fallback experiment";
                middleUrl.searchParams.set("lighting", "poly-fallback");
                middleUrl.searchParams.set("polyScale", polyScale.value);
                middleUrl.searchParams.set("polyHemi", polyHemisphere.value);
                middleUrl.searchParams.set("polyHead", polyHead.value);
            } else if (middleModeButton.value === "bloom") {
                middleLabel.textContent = "Current main with bloom";
                middleUrl.searchParams.set("postfx", "bloom");
                if (bloomValuesExplicit) {
                    middleUrl.searchParams.set("bloomStrength", bloomStrength.value);
                    middleUrl.searchParams.set("bloomThreshold", bloomThreshold.value);
                    middleUrl.searchParams.set("bloomRadius", bloomRadius.value);
                }
            } else if (middleModeButton.value === "vignette") {
                middleLabel.textContent = "Current main with Poly vignette";
                middleUrl.searchParams.set("postfx", "vignette");
                if (vignetteValueExplicit) {
                    middleUrl.searchParams.set("vignetteStrength", vignetteStrength.value);
                }
            } else {
                middleLabel.textContent = "Current main bundle";
            }
            middleViewer.src = middleUrl;
            updateLightingEvidence(fixture);
            updateReference(fixture).catch(error => {
                referenceName.textContent = `Metadata error: ${error.message}`;
            });
        }

        await populateFixtureSelect(fixtureSelect, initialFixture);
        fixtureSelect.addEventListener("change", loadFixture);
        loadFixture();
    </script>
</body>
</html>
