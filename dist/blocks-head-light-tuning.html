<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blocks head-light tuning</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
                "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/",
                "three-icosa": "./three-icosa.module.js?v=blocks-head-tuning-1",
                "three-tiltloader": "https://cdn.jsdelivr.net/npm/three-tiltloader@0.4.2-alpha.4/dist/three-tiltloader.module.js",
                "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.1.0/dist/spark.module.js"
            }
        }
    </script>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #151515; color: #eee; }
        body { display: grid; grid-template-rows: auto 1fr; }
        #controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-bottom: 1px solid #444;
            background: #202020;
        }
        select, input, button { font: inherit; }
        select, input[type="number"], button { padding: 4px 7px; }
        input[type="range"] { width: min(360px, 30vw); }
        input[type="number"] { width: 76px; }
        #preset-buttons { display: flex; gap: 4px; }
        #status { margin-left: auto; color: #bbb; font: 12px/1.3 monospace; }
        #comparison { min-height: 0; display: grid; grid-template-columns: 2fr 1fr; }
        .panel { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
        .panel-label {
            position: absolute;
            z-index: 30;
            top: 10px;
            left: 10px;
            padding: 5px 8px;
            border-radius: 3px;
            background: rgba(0, 0, 0, 0.72);
            font-size: 13px;
        }
        #icosa-viewer { width: 100%; height: 100%; }
        #reference { display: grid; place-items: center; border-left: 1px solid #444; background: #111; }
        #reference img { display: block; width: 100%; height: 100%; object-fit: contain; }
        @media (max-width: 850px) {
            #comparison { grid-template-columns: 1fr; grid-template-rows: 2fr 1fr; }
            #reference { border-left: 0; border-top: 1px solid #444; }
            #status { width: 100%; margin-left: 0; }
        }
    </style>
</head>
<body>
    <div id="controls">
        <label for="asset">Blocks model</label>
        <select id="asset">
            <option>Loading full API fixture catalog…</option>
        </select>

        <label for="head-multiplier">Head multiplier</label>
        <input id="head-multiplier" type="range" min="0" max="3.5" step="0.05" value="1">
        <input id="head-number" type="number" min="0" max="3.5" step="0.05" value="1">
        <div id="preset-buttons" aria-label="Multiplier presets">
            <button type="button" data-value="0">0</button>
            <button type="button" data-value="0.5">0.5</button>
            <button type="button" data-value="0.75">0.75</button>
            <button type="button" data-value="1">1</button>
            <button type="button" data-value="1.5">1.5</button>
            <button type="button" data-value="2">2</button>
        </div>
        <label for="rig-mode">Rig</label>
        <select id="rig-mode">
            <option value="manual">Current fallback + manual head</option>
            <option value="poly">Embedded Poly key + head</option>
        </select>
        <span id="status">Loading…</span>
    </div>

    <main id="comparison">
        <section class="panel">
            <div class="panel-label">Live viewer — one-pass sRGB, no optional post-effects</div>
            <div id="icosa-viewer"></div>
        </section>
        <aside id="reference" class="panel">
            <div class="panel-label">Authoritative Poly thumbnail</div>
            <img id="thumbnail" alt="Authoritative Poly thumbnail">
        </aside>
    </main>

    <script type="module">
        import { Viewer } from "./icosa-viewer.module.js?v=blocks-head-tuning-1";
        import { populateApiAssetSelect } from "./comparison-fixtures.js";

        const params = new URLSearchParams(location.search);
        const assetSelect = document.getElementById("asset");
        const multiplierSlider = document.getElementById("head-multiplier");
        const multiplierNumber = document.getElementById("head-number");
        const rigMode = document.getElementById("rig-mode");
        const status = document.getElementById("status");
        const thumbnail = document.getElementById("thumbnail");
        const requestedAsset = params.get("asset") || "9L2Lt-sxzdp";
        const requestedMultiplier = Number(params.get("head") ?? 1);
        const requestedRig = params.get("rig") === "poly" ? "poly" : "manual";

        await populateApiAssetSelect(assetSelect, requestedAsset, "9L2Lt-sxzdp");

        const initialMultiplier = Number.isFinite(requestedMultiplier)
            ? Math.min(3.5, Math.max(0, requestedMultiplier))
            : 1;
        multiplierSlider.value = String(initialMultiplier);
        multiplierNumber.value = String(initialMultiplier);
        rigMode.value = requestedRig;

        assetSelect.addEventListener("change", () => {
            const url = new URL(location.href);
            url.searchParams.set("asset", assetSelect.value);
            url.searchParams.set("head", multiplierSlider.value);
            url.searchParams.set("rig", rigMode.value);
            location.href = url;
        });

        const response = await fetch(`https://api.icosa.gallery/v1/assets/${assetSelect.value}`);
        if (!response.ok) throw new Error(`Icosa API returned ${response.status}`);
        const asset = await response.json();
        const format = asset.formats.find(candidate => candidate.isPreferredForGalleryViewer);
        if (!format?.root?.url) throw new Error("No preferred Gallery Viewer format");
        if (format.formatType !== "GLTF2") {
            throw new Error(`This tuning page currently requires preferred GLTF2; API selected ${format.formatType}`);
        }

        const gltfResponse = await fetch(format.root.url);
        if (!gltfResponse.ok) throw new Error(`glTF request returned ${gltfResponse.status}`);
        const gltfJson = await gltfResponse.json();
        const punctualLights = gltfJson.extensions?.KHR_lights_punctual?.lights || [];
        const lightNodes = (gltfJson.nodes || []).filter(node => node.extensions?.KHR_lights_punctual);
        function embeddedLight(role, fallbackName) {
            const node = lightNodes.find(candidate => candidate.extras?.[role] === 1)
                || lightNodes.find(candidate => candidate.name === fallbackName);
            const lightIndex = node?.extensions?.KHR_lights_punctual?.light;
            return Number.isInteger(lightIndex) ? punctualLights[lightIndex] : undefined;
        }
        const embeddedKey = embeddedLight("isKeyLight", "keyLightNode");
        const embeddedHead = embeddedLight("isHeadLight", "headLightNode");

        const thumbnailUrl = new URL(asset.thumbnail.url);
        thumbnailUrl.searchParams.set("cors", "anonymous");
        thumbnail.src = thumbnailUrl.href;

        const presentation = asset.presentationParams;
        const viewer = new Viewer(new URL("./sketch_assets/", location.href).toString());
        window.viewer = viewer;
        await viewer.loadGltf(format.root.url, true, {
            defaultBackgroundColor: presentation.backgroundColor,
            camera: {
                ...(presentation.camera || {}),
                ...(asset.camera || {})
            },
            geometryData: presentation.GOOGLE_geometry_data,
            colorSpace: presentation.colorSpace
        });
        if (viewer.loadingError) throw new Error(`Viewer failed to load ${asset.displayName}`);

        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const headLight = viewer.scene.getObjectByName("FallbackHeadLight");
        const keyLight = viewer.scene.getObjectByName("FallbackKeyLight");
        if (!headLight?.isDirectionalLight) {
            throw new Error("FallbackHeadLight was not created for this model");
        }
        if (!keyLight?.isDirectionalLight) {
            throw new Error("FallbackKeyLight was not created for this model");
        }

        const baseHeadIntensity = 0.25 * Math.PI;
        const baseKeyIntensity = 0.325 * Math.PI;
        function applyMultiplier(value) {
            const multiplier = Math.min(3.5, Math.max(0, Number(value)));
            if (!Number.isFinite(multiplier)) return;
            multiplierSlider.value = String(multiplier);
            multiplierNumber.value = String(multiplier);
            const usePolyRig = rigMode.value === "poly";
            if (usePolyRig) {
                if (!embeddedKey || !embeddedHead) {
                    throw new Error("The preferred glTF has no embedded Poly key/head rig");
                }
                keyLight.intensity = embeddedKey.intensity * Math.PI;
                headLight.intensity = embeddedHead.intensity * Math.PI;
            } else {
                keyLight.intensity = baseKeyIntensity;
                headLight.intensity = baseHeadIntensity * multiplier;
            }
            multiplierSlider.disabled = usePolyRig;
            multiplierNumber.disabled = usePolyRig;
            const rigDescription = usePolyRig
                ? `Poly key ${keyLight.intensity.toFixed(3)} · head ${headLight.intensity.toFixed(3)}`
                : `manual head ${multiplier.toFixed(2)} · intensity ${headLight.intensity.toFixed(3)}`;
            status.textContent = `${asset.displayName} · ${rigDescription}`;
            const url = new URL(location.href);
            url.searchParams.set("asset", assetSelect.value);
            url.searchParams.set("head", multiplier.toFixed(2));
            url.searchParams.set("rig", rigMode.value);
            history.replaceState(null, "", url);
        }

        multiplierSlider.addEventListener("input", () => applyMultiplier(multiplierSlider.value));
        multiplierNumber.addEventListener("input", () => applyMultiplier(multiplierNumber.value));
        rigMode.addEventListener("change", () => applyMultiplier(multiplierSlider.value));
        document.getElementById("preset-buttons").addEventListener("click", event => {
            const value = event.target.dataset.value;
            if (value !== undefined) applyMultiplier(value);
        });
        applyMultiplier(initialMultiplier);
    </script>
</body>
</html>
